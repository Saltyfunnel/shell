# hyprlock.conf — generated by matugen from your wallpaper. Edit the template, not this file.
# Template: ~/.config/matugen/templates/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ---------- wallpaper, blurred and dimmed ----------
background {
    monitor =
    path = {{image}}
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.9
}

# ---------- clock ----------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    font_size = 110
    font_family = Hack Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# ---------- date ----------
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color = rgba({{colors.primary.default.hex_stripped}}ff)
    font_size = 20
    font_family = Hack Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# ---------- password box ----------
input-field {
    monitor =
    size = 320, 54
    rounding = -1
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba({{colors.primary.default.hex_stripped}}ff)
    inner_color = rgba({{colors.surface.default.hex_stripped}}d9)
    font_color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    check_color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    fail_color = rgba({{colors.error.default.hex_stripped}}ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##{{colors.on_surface_variant.default.hex_stripped}}">  $USER</span>
    fail_text = <i>$FAIL</i>
    font_family = Hack Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
