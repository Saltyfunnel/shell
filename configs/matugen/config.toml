# matugen: one wallpaper in, every app recoloured.
# Each [templates.x] reads a template and writes the finished file to the app's real config path.

[config]

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -USR1 kitty"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako-config"
output_path = "~/.config/mako/config"
post_hook   = "makoctl reload"

[templates.quickshell]
input_path  = "~/.config/matugen/templates/Colors.qml"
output_path = "~/.config/quickshell/Colors.qml"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload"

[templates.accent]
input_path  = "~/.config/matugen/templates/accent.txt"
output_path = "~/.cache/accent_color"

[templates.zed]
input_path = "~/.config/matugen/templates/zed-theme.json"
output_path = "~/.config/zed/themes/material-dynamic.json"

[templates.fastfetch]
input_path  = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

# Lock screen. hyprlock reads its config each time it starts, so no hook is needed.
[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.conf"

# SDDM login screen. Main.qml reads this pywal-style file.
# /var/cache/wal is created and owned by you by install-sddm-theme.sh.
[templates.sddm]
input_path  = "~/.config/matugen/templates/sddm-colors.json"
output_path = "/var/cache/wal/colors.json"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -SIGUSR2 btop'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-theme'
output_path = '~/.config/cava/themes/matugen'
post_hook = 'pkill -USR2 cava || true'

[config.custom_colors]
green  = { color = "#8fd18a", blend = true }
yellow = { color = "#e6c86e", blend = true }
blue   = { color = "#6fb1e8", blend = true }
cyan   = { color = "#5fd0c8", blend = true }
orange = { color = "#f0a06a", blend = true }
